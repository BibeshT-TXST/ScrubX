name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Exact, not 22.x: a new Node can bring new Unicode data, which can move
          # normalization and regex results. A Node bump should show up as its own diff.
          node-version: 22.17.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Evaluation gate
        run: npm run eval -- --check
