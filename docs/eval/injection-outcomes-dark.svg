<text x="24" y="502" font-size="12" fill="#c3c2b7">Each bar shows the split within its own row, so the bars for 5 messages and for 339 are the same length.</text><text x="24" y="519" font-size="12" fill="#c3c2b7">This is a fixed test, not a security claim. An attacker who sees the rules and adapts will do better than any attack here.</text><text x="24" y="536" font-size="12" fill="#c3c2b7">Our set written by Bibesh with Claude 4.8 (incognito chat, no repo access). Detectors unchanged since the set was frozen. Commit</text><text x="24" y="553" font-size="12" fill="#c3c2b7">e6eb04d.</text><text x="24" y="570" font-size="12" fill="#c3c2b7">All data is synthetic, and these results don't predict performance on real clinical text.</text>
