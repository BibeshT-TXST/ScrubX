<text x="24" y="612" font-size="12" fill="#52514e">Counts Safe Harbor identifiers only, including month-only dates, which ScrubX leaves visible on purpose. ASQ-PHI counts hospitals</text><text x="24" y="629" font-size="12" fill="#52514e">as places, which ScrubX doesn't try to mask, and has no patient record, so its run tests identifiers ScrubX wasn't told about.</text><text x="24" y="646" font-size="12" fill="#52514e">Our set written by Bibesh with Claude 4.8 (incognito chat, no repo access). Detectors unchanged since the set was frozen. Commit</text><text x="24" y="663" font-size="12" fill="#52514e">1dabf3e. Intervals are 95% Wilson and treat items as independent, which is optimistic.</text><text x="24" y="680" font-size="12" fill="#52514e">All data is synthetic, and these results don't predict performance on real clinical text. Not a HIPAA compliance claim.</text>
