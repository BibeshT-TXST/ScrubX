<title id="phi-by-group-title">ScrubX missed 51% of identifiers on our test set and 49% on ASQ-PHI</title>
<desc id="phi-by-group-desc">All identifiers, our set: 169 of 331 missed. All identifiers, external set: 1448 of 2975 missed. Places and employers, our set: 37 of 54 missed. Places and employers, external set: 685 of 828 missed. Dates, our set: 25 of 46 missed. Dates, external set: 32 of 806 missed. IDs, our set: 19 of 36 missed. IDs, external set: 220 of 448 missed. Phone and fax, our set: 10 of 20 missed. Phone and fax, external set: 0 of 47 missed. Names, our set: 64 of 150 missed. Names, external set: 509 of 814 missed. Ages, our set: 11 of 12 missed. Ages, external set: 0 of 0 missed. Email, URL and IP, our set: 3 of 13 missed. Email, URL and IP, external set: 2 of 32 missed.</desc>
