<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 376" width="860" height="376" role="img" aria-labelledby="phi-by-shape-title phi-by-shape-desc" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="phi-by-shape-title">84% of identifiers were missed in all lowercase text, 48% in normal text</title>
<desc id="phi-by-shape-desc">all lowercase, our set: 27 of 32 missed. ALL CAPS, our set: 20 of 28 missed. Normal text, our set: 119 of 246 missed. Pasted, with markup, our set: 3 of 25 missed.</desc>
<rect width="860" height="376" rx="8" fill="#fcfcfb"/>
<text x="24" y="38" font-size="20" fill="#0b0b0b" font-weight="600">84% of identifiers were missed in all lowercase text, 48% in normal text</text>
<text x="24" y="62" font-size="14" fill="#52514e">Our set only. The public set has no case or formatting variants.</text>
<circle cx="31" cy="86" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="44" y="90" font-size="13" fill="#52514e">Hollow: 20 to 49 items, so read it loosely</text>
<text x="214" y="114" font-size="12" fill="#6f6e69">Share of identifiers missed, with 95% interval</text>
<text x="836" y="114" font-size="12" fill="#6f6e69" text-anchor="end">missed / total</text>
<line x1="214" x2="214" y1="124" y2="256" stroke="#c3c2b7"/><text x="214" y="272" font-size="12" fill="#6f6e69" text-anchor="middle" style="font-variant-numeric:tabular-nums">0%</text>
<line x1="335.5" x2="335.5" y1="124" y2="256" stroke="#e1e0d9"/><text x="335.5" y="272" font-size="12" fill="#6f6e69" text-anchor="middle" style="font-variant-numeric:tabular-nums">25%</text>
<line x1="457" x2="457" y1="124" y2="256" stroke="#e1e0d9"/><text x="457" y="272" font-size="12" fill="#6f6e69" text-anchor="middle" style="font-variant-numeric:tabular-nums">50%</text>
<line x1="578.5" x2="578.5" y1="124" y2="256" stroke="#e1e0d9"/><text x="578.5" y="272" font-size="12" fill="#6f6e69" text-anchor="middle" style="font-variant-numeric:tabular-nums">75%</text>
<line x1="700" x2="700" y1="124" y2="256" stroke="#e1e0d9"/><text x="700" y="272" font-size="12" fill="#6f6e69" text-anchor="middle" style="font-variant-numeric:tabular-nums">100%</text>
<text x="24" y="144" font-size="14" fill="#0b0b0b">all lowercase</text>
<line x1="545.7" x2="666.6" y1="139" y2="139" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="624.1" cy="139" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="836" y="143" font-size="13" fill="#52514e" text-anchor="end" style="font-variant-numeric:tabular-nums">27 / 32</text>
<text x="24" y="178" font-size="14" fill="#0b0b0b">ALL CAPS</text>
<line x1="471.3" x2="625.9" y1="173" y2="173" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="561.1" cy="173" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="836" y="177" font-size="13" fill="#52514e" text-anchor="end" style="font-variant-numeric:tabular-nums">20 / 28</text>
<text x="24" y="212" font-size="14" fill="#0b0b0b">Normal text</text>
<line x1="419.1" x2="479.3" y1="207" y2="207" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="449.1" cy="207" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="836" y="211" font-size="13" fill="#52514e" text-anchor="end" style="font-variant-numeric:tabular-nums">119 / 246</text>
<text x="24" y="246" font-size="14" fill="#0b0b0b">Pasted, with markup</text>
<line x1="234.3" x2="359.6" y1="241" y2="241" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="272.3" cy="241" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="836" y="245" font-size="13" fill="#52514e" text-anchor="end" style="font-variant-numeric:tabular-nums">3 / 25</text>
<text x="24" y="300" font-size="12" fill="#52514e">Each row holds a different mix of identifier types, so this shows where misses cluster and is not a controlled comparison.</text><text x="24" y="317" font-size="12" fill="#52514e">Our set written by Bibesh with Claude 4.8 (incognito chat, no repo access). Detectors unchanged since the set was frozen. Commit</text><text x="24" y="334" font-size="12" fill="#52514e">1dabf3e. Intervals are 95% Wilson and treat items as independent, which is optimistic.</text><text x="24" y="351" font-size="12" fill="#52514e">All data is synthetic, and these results don't predict performance on real clinical text. Not a HIPAA compliance claim.</text>
</svg>
